<!DOCTYPE html>

<html>

<head>

<title>Donor List</title>


<style>


body{

font-family:Arial;
text-align:center;
background:#f4f4f4;

}



table{

width:95%;
margin:auto;
border-collapse:collapse;
background:white;

}



th{

background:darkred;
color:white;

}



td,th{

padding:10px;
border:1px solid gray;

}



button{

background:red;
color:white;
border:none;
padding:8px;
border-radius:5px;

}


</style>


</head>



<body>


<h2>Registered Donors</h2>


<div id="stats"></div>



<script>



function showStats(){



let donors =
JSON.parse(localStorage.getItem("donors")) || [];



let html=`

<table>


<tr>

<th>S.No</th>
<th>Name</th>
<th>Age</th>
<th>Gender</th>
<th>Blood Group</th>
<th>District</th>
<th>Address</th>
<th>Phone</th>
<th>Action</th>

</tr>


`;



donors.forEach(function(d,index){



html+=`

<tr>

<td>${index+1}</td>

<td>${d.name}</td>

<td>${d.age}</td>

<td>${d.gender}</td>

<td>${d.bloodGroup}</td>

<td>${d.district}</td>

<td>${d.address}</td>

<td>${d.phone}</td>


<td>

<button onclick="deleteDonor(${index})">

Delete

</button>

</td>


</tr>


`;



});



html+="</table>";



document.getElementById("stats").innerHTML=html;



}




function deleteDonor(index){



let donors =
JSON.parse(localStorage.getItem("donors")) || [];



donors.splice(index,1);



localStorage.setItem(
"donors",
JSON.stringify(donors)
);



showStats();


}



showStats();



</script>


</body>

</html>
